services:
  postgres:
    image: postgres:16-alpine
    container_name: terraforge-postgres
    restart: always
    environment:
      POSTGRES_USER: terraforge
      POSTGRES_PASSWORD: terraforge
      POSTGRES_DB: terraforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraforge -d terraforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terraforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraforge-api
    restart: always
    command: python scripts/start_api.py
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://terraforge:terraforge@postgres:5432/terraforge
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraforge-worker
    restart: always
    command: python scripts/start_worker.py
    environment:
      DATABASE_URL: postgresql+asyncpg://terraforge:terraforge@postgres:5432/terraforge
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
